; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Les deux environnements sont construits par defaut (pio run sans -e) pour
; que .pio/build/wokwi/firmware.bin existe toujours apres un build depuis
; VS Code/PlatformIO, meme si l'extension ne cible que l'env par defaut.
[platformio]
default_envs = esp32dev, wokwi

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
build_flags =
	-DCORE_DEBUG_LEVEL=0
lib_deps =
	esp32async/AsyncTCP @ ^3.4.10
	esp32async/ESPAsyncWebServer @ ^3.11.2
	bblanchon/ArduinoJson @ ^7.0.4
	knolleary/PubSubClient@^2.8.0

; Environnement reserve a la simulation Wokwi : mode WiFi station (rejoint
; "Wokwi-GUEST") au lieu du point d'acces reel, pour tester l'API et l'app
; Flutter via le Private Gateway Wokwi (http://localhost:9080). Le firmware
; reel (env:esp32dev) n'est pas touche.
[env:wokwi]
extends = env:esp32dev
build_flags =
	-DCORE_DEBUG_LEVEL=0
	-DWOKWI_SIMULATION
