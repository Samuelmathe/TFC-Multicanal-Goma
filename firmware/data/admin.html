<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TFC Multicanal - Admin</title>
<link rel="stylesheet" href="/style.css">
<header class="topbar">
  <a class="lien-accueil" href="/">
    <div class="logo">&#9889;</div>
    <div class="titres">
      <h1>Vue bailleur / administrateur</h1>
      <span class="sous-titre">TFC Multicanal</span>
    </div>
  </a>
</header>
<main>
  <div class="card">
    <div class="resume">
      <div class="pastille">Tension secteur simulee <b id="tensionSecteur">--</b> V</div>
      <div class="pastille">Tarif <b id="tarif">--</b> USD/kWh</div>
    </div>
  </div>

  <div class="card">
    <h2>Canaux</h2>
    <table>
      <thead>
        <tr><th>Canal</th><th>Courant (A)</th><th>Puissance (W)</th><th>Energie (kWh)</th><th>Credit (USD)</th><th>Etat</th><th>Dernier evenement</th></tr>
      </thead>
      <tbody id="corpsTable"></tbody>
    </table>
  </div>

  <div class="card">
    <h2>Enregistrer une recharge</h2>
    <form onsubmit="envoyerRecharge(event)">
      <label>Canal
        <select id="selectCanal"></select>
      </label>
      <label>Montant (USD)
        <input type="number" id="montant" step="0.01" min="0.01" required>
      </label>
      <button type="submit">Recharger</button>
    </form>
  </div>
</main>

<script src="/app.js"></script>
<script>
  rafraichirAdmin();
  setInterval(rafraichirAdmin, 2000);
</script>
